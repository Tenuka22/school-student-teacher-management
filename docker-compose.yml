name: school-student-teacher-management

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      BETTER_AUTH_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/school-student-teacher-management
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      # The server clock must not depend on the host (see apps/web/Dockerfile).
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: school-student-teacher-management-postgres
    environment:
      POSTGRES_DB: school-student-teacher-management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    # Published on the loopback interface only. It used to listen on every
    # interface with the default password `password` (audit F-28); set
    # POSTGRES_PASSWORD for anything but a single developer's machine.
    ports:
      - "127.0.0.1:3000:5432"
    volumes:
      - school-student-teacher-management_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Object storage for uploaded files (item photos today). The same MinIO
  # server this stack runs against in every environment, addressed through
  # the S3 API — `apps/web/src/services.server.ts` never special-cases MinIO
  # vs. real S3.
  minio:
    image: quay.io/minio/minio:latest
    container_name: school-student-teacher-management-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    # Loopback only, like postgres: the app reaches MinIO over the compose
    # network, and nobody else needs to.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - school-student-teacher-management_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-shot: creates the bucket the app writes to (`MINIO_BUCKET`, default
  # `aloysius`) if it does not already exist, then exits. MinIO never creates
  # a bucket on its own — the app assumes it is there, the same assumption
  # `web`'s own `depends_on: service_healthy` makes about the database schema
  # already being migrated.
  minio-init:
    image: quay.io/minio/minio:latest
    container_name: school-student-teacher-management-minio-init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
        mc mb --ignore-existing local/${MINIO_BUCKET:-aloysius}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  school-student-teacher-management_postgres_data:
  school-student-teacher-management_minio_data:

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: apps/web/.env
