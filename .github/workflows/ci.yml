name: CI

# Every gate that would have caught the forensic audit's findings before they
# reached master: lint, types, a database built from the migrations alone, a
# schema/snapshot drift check, the integration suite against real PostgreSQL
# (which also runs the seeds twice), and the production build.
#
# There is deliberately no auto-fix job any more. It ran on every push with
# `contents: write` and pushed bot commits to any branch, master included
# (audit F-29). Run `bun run fix` locally; CI only reports.

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

# Placeholder values for the Varlock schema, which `bun install`'s postinstall
# codegen and the Vite build both validate. Validation values only: the server
# reads its real environment at runtime, nothing here is a deployment secret,
# and the integration tests configure their own auth in-process.
env:
  NODE_ENV: test
  BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime-000
  BETTER_AUTH_URL: http://localhost:3001
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  ADMIN_PASSWORD: ci-placeholder-admin-1
  ADMIN_NAME: Admin
  PRINCIPAL_PASSWORD: ci-placeholder-principal-1
  PRINCIPAL_NAME: Principal
  INVENTORY_ADMIN_PASSWORD: ci-placeholder-inventory-1
  INVENTORY_ADMIN_NAME: Inventory Administrator
  ACADEMIC_ADMIN_PASSWORD: ci-placeholder-academic-1
  ACADEMIC_ADMIN_NAME: Academic Administrator
  LEAVE_ADMIN_PASSWORD: ci-placeholder-leave-1
  LEAVE_ADMIN_NAME: Leave Administrator

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Lint and format (ultracite)
        run: bun run check

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Migrate an empty database from zero
        run: bun run db:verify-migrations
      - name: Schema matches the latest migration snapshot
        run: bun run db:check-drift
      - name: Typecheck api, auth and db
        run: bunx tsc -b packages/api
      - name: Typecheck the test suites
        run: bun run check-types:tests
      - name: Integration and unit tests (real PostgreSQL; includes seed twice)
        run: bun run test

  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Production build and web typecheck
        working-directory: apps/web
        run: bun run check-types
